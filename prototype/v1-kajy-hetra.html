<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app header + scrollable tab strip; each tool = form card beside a "tax notice" ticket (stacks on phones) */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#10261F; --muted:#56685F; --line:#D3DCD6;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --soft:#DDEDE5; --stamp:#B3122B; --warn-bg:#FFF1D6; --warn-ink:#6B4A00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1613; --surface:#13211C; --ink:#E4EEE9; --muted:#93A79D; --line:#25372F;
  --accent:#43C394; --accent-ink:#06261B; --soft:#173629; --stamp:#FF7A85; --warn-bg:#3A2E10; --warn-ink:#FFD98A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1613; --surface:#13211C; --ink:#E4EEE9; --muted:#93A79D; --line:#25372F;
  --accent:#43C394; --accent-ink:#06261B; --soft:#173629; --stamp:#FF7A85; --warn-bg:#3A2E10; --warn-ink:#FFD98A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--f-mono);font-weight:600;font-size:15px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:52ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);
  padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

.panel{padding-top:14px}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.4vw,30px);line-height:1.15;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eg{align-self:flex-start;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:5px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.in{position:relative;display:flex;align-items:center}
input[type=text],input[type=number],select{width:100%;font:500 17px var(--f-mono);color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
select{font:500 15px var(--f-body)}
.in input{padding-right:46px}
.in .u{position:absolute;right:12px;color:var(--muted);font:600 13px var(--f-mono);pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--muted);font:600 14px var(--f-body);padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:600 20px var(--f-mono);cursor:pointer}
.step input{text-align:center;width:80px;flex:none}

/* the "avis d'imposition" ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;position:relative;min-width:0}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:var(--r) var(--r) 0 0;
  background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 24px)}
.t-head{display:flex;justify-content:space-between;gap:10px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row span:first-child{color:var(--muted);min-width:0}
.row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row.neg span:last-child{color:var(--muted)}
.row.note span:first-child{color:var(--accent);font-weight:600}
.total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;padding-top:14px}
.total .k{font-weight:600}
.total .v{font:600 clamp(26px,6vw,34px)/1.1 var(--f-mono);color:var(--stamp);font-variant-numeric:tabular-nums}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:500 13px var(--f-mono);background:var(--soft);color:var(--ink);padding:6px 10px;border-radius:6px}
.chip b{font-family:var(--f-body);font-weight:600;color:var(--muted);margin-right:6px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}

.bar-wrap{margin-top:16px}
.bar-t{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.bar div{min-width:0;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--ink);overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font:500 12px var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

details.how{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.how summary{cursor:pointer;font-weight:600;padding:14px 0;list-style-position:outside}
details.how ol{margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:72ch;color:var(--ink)}
.about{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.about ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.about a{color:var(--accent)}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media (prefers-reduced-motion:no-preference){.bar div{transition:flex-grow .35s ease}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">Ar</div>
      <div>
        <h1>Kajy Hetra</h1>

      </div>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language / Fiteny">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="mg">MG</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="irsa" data-i18n="tab_irsa"></button>
    <button class="tab" role="tab" data-tab="is" data-i18n="tab_is"></button>
    <button class="tab" role="tab" data-tab="tva" data-i18n="tab_tva"></button>
    <button class="tab" role="tab" data-tab="ir" data-i18n="tab_ir"></button>
    <button class="tab" role="tab" data-tab="pen" data-i18n="tab_pen"></button>

  <!-- IRSA -->
  <section class="panel" id="p-irsa" role="tabpanel">

        <label class="f"><span data-i18n="f_brut"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="irsa-brut" value="1200000"><span class="u">Ar</span></span></label>

            <button type="button" id="dep-minus" aria-label="−">−</button>

        <label class="check"><input type="checkbox" id="irsa-cotis" checked><span data-i18n="f_cotis"></span></label>

      <div class="ticket" aria-live="polite">

        <div class="sub" id="irsa-sub"></div>
        <div class="bar-wrap">
          <div class="bar-t" data-i18n="bar_title"></div>

    </div>
    <details class="how"><summary data-i18n="how"></summary>

  <!-- IS -->
  <section class="panel" id="p-is" role="tabpanel" hidden>
    <h2 data-i18n="is_h"></h2>
    <p class="lead" data-i18n="is_lead"></p>
    <div class="grid">
      <div class="card">
        <span class="eg" data-i18n="example"></span>
        <label class="f"><span data-i18n="f_ca"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="is-ca" value="36000000"><span class="u">Ar</span></span></label>
        <label class="f"><span data-i18n="f_achats"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="is-achats" value="12000000"><span class="u">Ar</span></span></label>
        <label class="f"><span data-i18n="f_sal"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="is-sal" value="0"><span class="u">Ar</span></span></label>
        <label class="f"><span data-i18n="f_act"></span>
          <select id="is-act">
            <option value="16000" data-i18n="act1"></option>
            <option value="50000" data-i18n="act2"></option>
            <option value="100000" data-i18n="act3" selected></option>
            <option value="150000" data-i18n="act4"></option>
          </select></label>
      </div>
      <div class="ticket" aria-live="polite">
        <div class="t-head"><span data-i18n="tk_is"></span><span data-i18n="tk_year"></span></div>
        <div class="warn" id="is-warn" hidden data-i18n="is_warn"></div>
        <div class="rows" id="is-rows"></div>
        <div class="total"><span class="k" data-i18n="r_is"></span><span class="v" id="is-total"></span></div>
        <div class="sub" id="is-sub"></div>
      </div>
    </div>
    <details class="how"><summary data-i18n="how"></summary>
      <ol><li data-i18n="is_how1"></li><li data-i18n="is_how2"></li><li data-i18n="is_how3"></li></ol></details>

  <!-- TVA -->
  <section class="panel" id="p-tva" role="tabpanel" hidden>
    <h2 data-i18n="tva_h"></h2>
    <p class="lead" data-i18n="tva_lead"></p>
    <div class="grid">
      <div class="card">
        <span class="eg" data-i18n="example"></span>
        <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">
          <span data-i18n="f_mode"></span>
          <div class="seg"><button type="button" id="tva-ht" aria-pressed="true" data-i18n="mode_ht"></button><button type="button" id="tva-ttc" aria-pressed="false" data-i18n="mode_ttc"></button></div>

        <label class="f"><span data-i18n="f_amount"></span>

      <div class="ticket" aria-live="polite">
        <div class="t-head"><span data-i18n="tk_tva"></span><span id="tva-rate-lbl"></span></div>

      </div>
    </div>
    <details class="how"><summary data-i18n="how"></summary>
      <ol><li data-i18n="tva_how1"></li><li data-i18n="tva_how2"></li><li data-i18n="tva_how3"></li></ol></details>

  <!-- IR / IRCM -->
  <section class="panel" id="p-ir" role="tabpanel" hidden>
    <h2 data-i18n="ir_h"></h2>
    <p class="lead" data-i18n="ir_lead"></p>
    <div class="grid">
      <div class="card">
        <span class="eg" data-i18n="example"></span>
        <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">
          <span data-i18n="f_kind"></span>
          <div class="seg"><button type="button" id="ir-ir" aria-pressed="true">IR</button><button type="button" id="ir-ircm" aria-pressed="false">IRCM</button></div>
        </div>
        <label class="f"><span id="ir-lbl" data-i18n="f_benef"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="ir-amt" value="10000000"><span class="u">Ar</span></span></label>
      </div>
      <div class="ticket" aria-live="polite">
        <div class="t-head"><span id="ir-tk">IR</span><span data-i18n="tk_year"></span></div>
        <div class="rows" id="ir-rows"></div>
        <div class="total"><span class="k" data-i18n="r_due"></span><span class="v" id="ir-total"></span></div>
      </div>
    </div>
    <details class="how"><summary data-i18n="how"></summary>
      <ol><li data-i18n="ir_how1"></li><li data-i18n="ir_how2"></li><li data-i18n="ir_how3"></li></ol></details>
  </section>

  <!-- Pénalités -->
  <section class="panel" id="p-pen" role="tabpanel" hidden>
    <h2 data-i18n="pen_h"></h2>
    <p class="lead" data-i18n="pen_lead"></p>
    <div class="grid">
      <div class="card">
        <span class="eg" data-i18n="example"></span>
        <label class="f"><span data-i18n="f_due"></span>
          <span class="in"><input type="text" inputmode="numeric" class="money" id="pen-amt" value="500000"><span class="u">Ar</span></span></label>

        <div class="total"><span class="k" data-i18n="r_total"></span><span class="v" id="pen-total"></span></div>

      <ol><li data-i18n="pen_how1"></li><li data-i18n="pen_how2"></li><li data-i18n="pen_how3"></li></ol></details>

let lang='fr';
try{const s=localStorage.getItem('kh-lang'); if(T[s]) lang=s;}catch(e){}
const t=k=>(T[lang][k]??T.fr[k]??k);
const $=id=>document.getElementById(id);
const LOC={fr:'fr-FR',en:'en-US',mg:'fr-FR'};
const num=n=>Math.round(n).toLocaleString(LOC[lang]).replace(/[  ]/g,' ');
const ar=n=>num(n)+' Ar';
const pct=(n,d=1)=>(n*100).toLocaleString(LOC[lang],{maximumFractionDigits:d})+' %';
const down100=n=>Math.floor(n/100)*100;
const val=id=>Number(String($(id).value).replace(/\D/g,''))||0;
const row=(k,v,cls='')=>`<div class="row ${cls}"><span>${k}</span><span>${v}</span></div>`;
const chip=(k,v)=>`<span class="chip"><b>${k}</b>${v}</span>`;

/* ---------- pure calculators ---------- */
const BRACKETS=[[0,350000,0],[350000,400000,.05],[400000,500000,.10],[500000,600000,.15],[600000,4000000,.20],[4000000,Infinity,.25]];
function calcIRSA(brut,dep,cotis){
  const cap=2400000;
  const cn=cotis?Math.round(Math.min(brut,cap)*0.01):0, os=cn;
  const base=Math.max(0,down100(brut-cn-os));
  const parts=BRACKETS.map(([lo,hi,r])=>{const amt=Math.max(0,Math.min(base,hi)-lo);return {lo,hi,r,amt,tax:amt*r};});
  const theo=parts.reduce((s,p)=>s+p.tax,0);
  const red=dep*2000;
  let due=Math.max(0,theo-red), minApplied=false;
  if(base>350000 && due<3000){due=3000;minApplied=true;}
  if(base<=350000) due=0;
  due=down100(due);
  const marg=[...parts].reverse().find(p=>p.amt>0);
  return {cn,os,base,parts,theo,red:Math.min(red,theo),due,minApplied,net:brut-cn-os-due,marg:marg?marg.r:0};
}
function calcIS(ca,achats,sal,minimum){
  const base=ca*0.05, r1=achats*0.02, r2=sal*0.02, floor=ca*0.03;
  let is=base-r1-r2, floorApplied=false, minApplied=false;
  if(is<floor){is=floor;floorApplied=true;}
  if(is<minimum){is=minimum;minApplied=true;}
  return {base,r1,r2,floor,is:down100(is),floorApplied,minApplied,real:ca>=200000000};
}
function calcTVA(amt,rate,fromHT){
  const ht=fromHT?amt:amt/(1+rate); const tva=ht*rate; return {ht,tva,ttc:ht+tva};
}
function calcPen(amt,months,ca,nodecl){
  const first=ca>=400000000?.03:ca>=100000000?.02:.01;
  let inter=amt*(first+(Math.max(1,months)-1)*0.01), minApplied=false;
  if(amt>0 && inter<2000){inter=2000;minApplied=true;}
  const fine=!nodecl?0:ca>=400000000?200000:ca>=200000000?100000:ca>=50000000?50000:20000;
  return {first,inter:down100(inter),minApplied,fine,total:down100(amt+inter+fine)};
}

/* ---------- renderers ---------- */
function rIRSA(){
  const brut=val('irsa-brut'), dep=Math.max(0,Math.min(20,Number($('irsa-dep').value)||0)), cotis=$('irsa-cotis').checked;
  const r=calcIRSA(brut,dep,cotis);
  let h='';
  if(cotis){h+=row(t('r_cnaps'),'− '+ar(r.cn),'neg')+row(t('r_ostie'),'− '+ar(r.os),'neg');}
  h+=row(t('r_base'),ar(r.base))+row(t('r_theo'),ar(r.theo));
  if(dep>0) h+=row(t('r_red'),'− '+ar(r.red),'neg');
  if(r.minApplied) h+=row(t('r_min'),ar(3000),'note');
  $('irsa-rows').innerHTML=h;
  $('irsa-total').textContent=ar(r.due);
  $('irsa-sub').innerHTML=chip(t('r_net'),ar(r.net))+chip(t('r_eff'),brut?pct(r.due/brut):'0 %')+chip(t('r_marg'),pct(r.marg,0));
  const shades=[8,22,36,52,70,90];
  const used=r.parts.filter(p=>p.amt>0);
  $('irsa-bar').innerHTML=used.map(p=>{const i=r.parts.indexOf(p);const dark=shades[i]>50;
    return `<div style="flex:${p.amt} 1 0;background:color-mix(in srgb,var(--accent) ${shades[i]}%,var(--surface));color:${dark?'var(--accent-ink)':'var(--ink)'}" title="${pct(p.r,0)} · ${ar(p.amt)}">${p.amt/(r.base||1)>0.09?pct(p.r,0):''}</div>`}).join('')||'<div style="flex:1"></div>';
  $('irsa-legend').innerHTML=used.map(p=>{const i=r.parts.indexOf(p);return `<span><i style="background:color-mix(in srgb,var(--accent) ${shades[i]}%,var(--surface))"></i>${pct(p.r,0)} · ${ar(p.tax)}</span>`}).join('');
}
function rIS(){
  const ca=val('is-ca'), r=calcIS(ca,val('is-achats'),val('is-sal'),Number($('is-act').value));
  $('is-warn').hidden=!r.real;
  let h=row(t('r_is_brut'),ar(r.base))+row(t('r_is_red1'),'− '+ar(r.r1),'neg');
  if(r.r2>0) h+=row(t('r_is_red2'),'− '+ar(r.r2),'neg');
  if(r.floorApplied && !r.minApplied) h+=row(t('r_is_floor'),ar(r.floor),'note');
  if(r.minApplied) h+=row(t('r_is_min'),ar(Number($('is-act').value)),'note');
  $('is-rows').innerHTML=h;
  $('is-total').textContent=ar(r.is);
  $('is-sub').innerHTML=chip(t('r_rate_ca'),ca?pct(r.is/ca,2):'—');
}
let tvaFromHT=true;
function rTVA(){
  const rate=Number($('tva-rate').value), r=calcTVA(val('tva-amt'),rate,tvaFromHT);
  $('tva-rate-lbl').textContent=pct(rate,0);
  $('tva-rows').innerHTML=row(t('r_ht'),ar(r.ht))+row(t('r_tva')+' ('+pct(rate,0)+')',ar(r.tva));
  $('tva-total').textContent=ar(r.ttc);
}
let irKind='ir';
function rIR(){
  const amt=val('ir-amt'), due=down100(amt*0.20);
  $('ir-lbl').textContent=t(irKind==='ir'?'f_benef':'f_rcm');
  $('ir-tk').textContent=irKind.toUpperCase();
  $('ir-rows').innerHTML=row(t('r_base2'),ar(amt))+row(t('r_rate'),pct(.2,0))+row(t('r_after'),ar(amt-due));
  $('ir-total').textContent=ar(due);
}
function rPen(){
  const amt=val('pen-amt'), mo=Math.max(1,Number($('pen-mo').value)||1), ca=val('pen-ca'), nd=$('pen-nodecl').checked;
  const r=calcPen(amt,mo,ca,nd);
  const rule=r.first===.03?'rule3':r.first===.02?'rule2':'rule1';
  let h=row(t('f_due'),ar(amt))+row(t('r_rule'),t(rule))+row(t('r_int')+' · '+mo,ar(r.inter));
  if(r.minApplied) h+=row(t('r_minint'),ar(2000),'note');
  if(nd) h+=row(t('r_amende'),ar(r.fine));
  $('pen-rows').innerHTML=h;
  $('pen-total').textContent=ar(r.total);
}
const renderAll=()=>{rIRSA();rIS();rTVA();rIR();rPen();};

/* ---------- i18n + nav ---------- */
function applyLang(){
  document.documentElement.lang=lang==='mg'?'mg':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  document.querySelectorAll('input.money').forEach(i=>{if(document.activeElement!==i) i.value=num(val(i.id))});
  renderAll();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('kh-lang',lang)}catch(e){}applyLang();}));

const TABS=['irsa','is','tva','ir','pen','about'];
function show(id){
  if(!TABS.includes(id)) id='irsa';
  TABS.forEach(k=>{$('p-'+k).hidden=k!==id});
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));

/* ---------- inputs ---------- */
document.querySelectorAll('input.money').forEach(i=>{
  i.addEventListener('input',renderAll);
  i.addEventListener('focus',()=>{i.value=String(val(i.id)||'');});
  i.addEventListener('blur',()=>{i.value=num(val(i.id));});
});
['irsa-dep','irsa-cotis','is-act','tva-rate','pen-mo','pen-nodecl'].forEach(id=>{$(id).addEventListener('input',renderAll);$(id).addEventListener('change',renderAll);});
const stepper=(minus,plus,id,min,max)=>{
  $(minus).addEventListener('click',()=>{$(id).value=Math.max(min,(Number($(id).value)||0)-1);renderAll();});
  $(plus).addEventListener('click',()=>{$(id).value=Math.min(max,(Number($(id).value)||0)+1);renderAll();});
};
stepper('dep-minus','dep-plus','irsa-dep',0,20);
stepper('mo-minus','mo-plus','pen-mo',1,120);
$('tva-ht').addEventListener('click',()=>{tvaFromHT=true;$('tva-ht').setAttribute('aria-pressed','true');$('tva-ttc').setAttribute('aria-pressed','false');rTVA();});
$('tva-ttc').addEventListener('click',()=>{tvaFromHT=false;$('tva-ttc').setAttribute('aria-pressed','true');$('tva-ht').setAttribute('aria-pressed','false');rTVA();});
$('ir-ir').addEventListener('click',()=>{irKind='ir';$('ir-ir').setAttribute('aria-pressed','true');$('ir-ircm').setAttribute('aria-pressed','false');$('ir-amt').value=num(10000000);rIR();});
$('ir-ircm').addEventListener('click',()=>{irKind='ircm';$('ir-ircm').setAttribute('aria-pressed','true');$('ir-ir').setAttribute('aria-pressed','false');$('ir-amt').value=num(2000000);rIR();});

show((location.hash||'').slice(1));
applyLang();
</script>
