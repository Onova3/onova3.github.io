// Thème et taille du texte appliqués avant l'affichage, pour éviter un flash blanc (mêmes valeurs que src/reglages.js et src/stockage.js).
try {
  var th = localStorage.getItem('kh-theme'), ta = localStorage.getItem('kh-taille');
  var sombre = th === 'sombre' || (th !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
  var tailles = { grande: 112.5, tresGrande: 125 };
  if (tailles[ta]) document.documentElement.style.fontSize = tailles[ta] + '%';
} catch (e) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
</script>
